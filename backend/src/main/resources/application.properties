spring.application.name=backend
server.port=8080

# MySQL connection (database "ttdb" is created automatically if missing)
spring.datasource.url=jdbc:mysql://localhost:3306/ttdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=manager

# Create/update tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Print the SQL queries in the terminal (useful to show in viva)
spring.jpa.show-sql=true
